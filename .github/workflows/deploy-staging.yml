# Push to main: build the image tagged with the commit SHA, push it to GHCR, then deploy it to the
# test stand. Prod is never deployed from here: it is rolled out by hand with the "Deploy prod" workflow,
# and only a SHA that has a green run of this workflow (the history of stand deploys) can go there.
name: Deploy staging

on:
  push:
    branches: [main]

# One run at a time; a newer push waits for the running one instead of cancelling it, so versions
# reach the server in the order of the merges. A deploy of one environment is also locked on the
# server itself (deploy.sh), for runs that do not come from this workflow.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          # One tag = one package version in GHCR (no untagged attestation manifests next to it),
          # so cleaning old versions after a prod deploy cannot break a live image.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: build
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to the test stand
        run: bash deploy/ci-deploy.sh staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
