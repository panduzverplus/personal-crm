# Every pull request: lint, format, types, unit tests, e2e tests, image build.
# The job name "ci" is the required status check in the protection of main: rename it in both places.
name: CI

on:
  pull_request:

# A new push to a pull request replaces the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # The database lives only as long as this run, so the password is random and stored nowhere.
      - name: Start the database
        run: |
          password="$(openssl rand -hex 16)"
          echo "POSTGRES_PASSWORD=$password" >> "$GITHUB_ENV"
          POSTGRES_PASSWORD="$password" pnpm db:up

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Keep the e2e traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
