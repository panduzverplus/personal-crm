schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Change and capability ids (folder names) are English kebab-case, e.g. keep-in-touch.

  Project: personal CRM for contacts of people the owner knows personally.
  Product idea, main scenario and constraints: specs/01-продуктовая-идея.md.
  Working rules, stack and deploy flow: CLAUDE.md.
  Product decisions belong to the owner: do not invent behavior that is missing
  from the request or the product idea - list it as an open question instead.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - "After Impact add three sections in this order, even when empty: ## Owner Decisions, ## Agent Decisions, ## Open Questions."
    - "Owner Decisions: what the owner decided in the request or in answers to questions. State the decision, not the discussion."
    - "Agent Decisions: product decisions the agent made because the request was silent, each with a one-line reason. Minor details only: anything that materially changes scope or behavior must be asked first. Technical decisions stay in design.md."
    - "Open Questions: questions still waiting for the owner, each with what applies if nobody answers. Write \"нет\" when there are none."
  specs:
    - "Record every product decision made here in the Owner Decisions, Agent Decisions or Open Questions section of proposal.md."
    - Every scenario has its own test
  tasks:
    - Test before code - write the test, run it and see it fail, then write the code and see the test pass
  design:
    - "Record every product decision made here in the Owner Decisions, Agent Decisions or Open Questions section of proposal.md."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
