# App (personal-crm): proxied to the app container on 127.0.0.1:3000 (deploy/compose.yaml).
server {
    listen 80;
    listen [::]:80;
    server_name app.chigabugadaga.ru;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.chigabugadaga.ru;

    include snippets/ssl-chigabugadaga.ru.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js streams pages; buffering would hold the streamed parts back.
        proxy_buffering off;
    }
}
