# Test stand: proxied to the stand's container on 127.0.0.1:3001 (deploy/compose.yaml, project "staging").
# The whole site is behind a password (basic auth, file /etc/nginx/test-app.htpasswd, made by setup-staging.sh).
# Only /health is open: the smoke check of the deploy calls it without the password.
# Its own certificate "test-app.chigabugadaga.ru", the landing and prod certificate is not touched.
server {
    listen 80;
    listen [::]:80;
    server_name test-app.chigabugadaga.ru;

    include snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-app.chigabugadaga.ru;

    ssl_certificate     /etc/letsencrypt/live/test-app.chigabugadaga.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.chigabugadaga.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:test_app_ssl:10m;
    ssl_session_timeout 1d;

    # The stand is not for search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    auth_basic           "Test stand";
    auth_basic_user_file /etc/nginx/test-app.htpasswd;

    location = /health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The password is checked here; the app has no use for it.
        proxy_set_header Authorization "";
        # Next.js streams pages; buffering would hold the streamed parts back.
        proxy_buffering off;
    }
}
