# One Let's Encrypt certificate covers the landing and the app.
ssl_certificate     /etc/letsencrypt/live/chigabugadaga.ru/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/chigabugadaga.ru/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_session_cache   shared:chigabugadaga_ssl:10m;
ssl_session_timeout 1d;
