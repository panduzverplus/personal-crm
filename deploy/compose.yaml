# Production stack on the server, run by deploy.sh as project "prod" with APP_IMAGE set.
# Settings and passwords come from .env next to this file (created by hand, mode 600).

x-app: &app
  image: ${APP_IMAGE:?APP_IMAGE is not set}
  env_file: .env
  environment:
    POSTGRES_HOST: crm-db
  depends_on:
    crm-db:
      condition: service_healthy

services:
  crm-db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - crm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  crm-app:
    <<: *app
    restart: unless-stopped
    # Only on 127.0.0.1: nginx proxies app.chigabugadaga.ru here.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # One-off: applies migrations and exits; deploy.sh runs it before starting a new image.
  crm-migrate:
    <<: *app
    command: ["node_modules/.bin/tsx", "src/db/migrate.ts"]
    profiles: [tools]

  # One-off: fills an empty database with test contacts.
  crm-seed:
    <<: *app
    command: ["node_modules/.bin/tsx", "src/db/seed.ts"]
    profiles: [tools]

volumes:
  crm-db-data:
