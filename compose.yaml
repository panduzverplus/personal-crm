services:
  postgres:
    image: postgres:17-alpine
    container_name: personal-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local mail catcher: the app sends login emails here, nothing leaves the computer.
  # SMTP on 1025, web page and API on 8025.
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: personal-crm-mailpit
    restart: unless-stopped
    environment:
      # Without this Mailpit does a reverse DNS lookup of every client before it greets it,
      # and behind Docker Desktop the lookup takes ~8 seconds: every login letter would wait for it.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
